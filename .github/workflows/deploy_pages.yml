name: 🌐 部署暗棋網頁端至 GitHub Pages (Deploy Frontend)

# 觸發條件：master 分支上有 frontend/、models/ 或此 workflow 檔案變更時觸發
on:
  push:
    branches: ["master"]
    paths:
      - 'frontend/**'
      - 'models/**'
      - '.github/workflows/deploy_pages.yml'
      - '.github/workflows/publish_training_status.yml'
      - '.github/scripts/publish_training_status.py'
  # A model promotion is pushed with GITHUB_TOKEN, and such a push does not
  # start another workflow. Deploy explicitly after successful training.
  workflow_run:
    workflows: ["Train and validate NNUE", "Publish training status"]
    types: [completed]
  workflow_dispatch: # 支援在 GitHub Actions 介面手動觸發

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: 🏗️ 前端單元測試與 Vite 靜態檔構建 (Build & Test)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 步驟 1：檢出專案程式碼 (Checkout Code)
        uses: actions/checkout@v4
        
      - name: 🟢 步驟 2：設定 Node.js 執行環境 (Node.js 22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: 📦 步驟 3：安裝前端 npm 相依套件
        working-directory: ./frontend
        run: npm ci
        
      - name: 🧪 步驟 4：執行 TDD 單元測試 (Vitest)
        working-directory: ./frontend
        run: npm run test -- --run
        
      - name: 🔨 步驟 5：編譯構建 Web Assembly 與 Vite 靜態網站
        working-directory: ./frontend
        run: npm run build
        
      - name: ⚙️ 步驟 6：設定 GitHub Pages 環境
        uses: actions/configure-pages@v4
        
      - name: 📤 步驟 7：上傳靜態網站產出物 (dist)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

  deploy:
    name: 🚀 發布至 GitHub Pages 雲端託管
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 📡 部署網頁版暗棋系統
        id: deployment
        uses: actions/deploy-pages@v4
