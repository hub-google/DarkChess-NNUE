name: Recover missing HF dataset and verify real replay

# One-time, bounded acceptance. If the HF dataset exists, it is preserved.
# This does not enable any hourly CPU workloads or promote a challenger.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/hf_bootstrap.yml"

jobs:
  bootstrap-and-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install CPU packages
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Restore missing Hugging Face dataset without overwriting existing data
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u src/training/hf_bootstrap.py
      - name: Generate and strictly validate one real completed game
        env:
          BATCH_SIZE: "1"
          NUM_BATCHES: "1"
          OUTPUT_DIR: "output_data"
          SELF_PLAY_SEED: "20261022"
          SEARCH_MAX_SECONDS: "3"
          SEARCH_NODE_BUDGET_EARLY: "500"
          SEARCH_NODE_BUDGET_MID: "1200"
          SEARCH_NODE_BUDGET_LATE: "2500"
          TORCH_NUM_THREADS: "1"
        run: |
          python -u src/workers/self_play.py
          python -u src/training/validate_replay.py --directory output_data --min-games 1
      - name: Upload completed game to Hugging Face staging
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          WORKER_ID: "1"
        run: |
          echo "PATH_IN_REPO=staging/worker_1/recovered_${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
          PATH_IN_REPO="staging/worker_1/recovered_${GITHUB_RUN_ID}" python -u src/workers/upload_batch.py
      - name: Check remote replay and verify real terminal state
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import gzip, json, os, sys
          from pathlib import Path
          from huggingface_hub import HfApi, hf_hub_download
          sys.path.insert(0, str(Path("src/training").resolve()))
          from validate_replay import validate_record
          api = HfApi(token=os.environ["HF_TOKEN"])
          repo = "hub-google/DarkChess-NNUE-Data"
          prefix = os.environ["PATH_IN_REPO"]
          files = [entry.path for entry in api.list_repo_tree(
              repo, path_in_repo=prefix, repo_type="dataset", recursive=True
          ) if entry.path.endswith(".jsonl.gz")]
          if len(files) != 1:
              raise RuntimeError(f"Expected one uploaded replay batch; found {files}")
          path = hf_hub_download(repo, filename=files[0],
                                 repo_type="dataset", token=os.environ["HF_TOKEN"])
          with gzip.open(path, "rt", encoding="utf-8") as stream:
              games = [json.loads(line) for line in stream if line.strip()]
          if len(games) != 1:
              raise RuntimeError(f"Expected one replay record; found {len(games)}")
          count = validate_record(games[0])
          print(f"[HF Bootstrap] REMOTE REPLAY VERIFIED: 1 game, {count} plies, {files[0]}")
          PY
      - name: Upload local debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hf-bootstrap-recovery-${{ github.run_id }}
          path: output_data/
          if-no-files-found: ignore
          retention-days: 7
