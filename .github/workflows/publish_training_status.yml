name: Publish training status
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Train and promote NNUE
    types: [completed]
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: darkchess-training-status
  cancel-in-progress: false

jobs:
  recover-failed-hf:
    # Reuse this existing workflow instead of creating another scheduled Action.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.name == 'Continuous self-play and recovery' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    concurrency:
      group: darkchess-hf-stage-writer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install replay validation and HF recovery dependencies
        run: pip install numpy numba huggingface_hub
      - name: Restore failed batches from GitHub Artifacts to Hugging Face
        env:
          GH_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MAX_RECOVERY_GROUPS: "4"
        run: python -u src/workers/recover_failed_uploads.py

  publish:
    if: always()
    needs: recover-failed-hf
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Hugging Face client
        run: python -m pip install huggingface_hub
      - name: Count verified HF replay and staging games
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u .github/scripts/publish_training_status.py
      - name: Commit changes without overwriting concurrent champion promotions
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/training-status.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: publish verified self-play progress"
          for attempt in 1 2 3 4 5; do
            git fetch origin master
            if ! git rebase origin/master; then
              git rebase --abort || true
              echo "::error::Training status rebase conflict."
              exit 1
            fi
            if git push origin HEAD:master; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep "$((attempt * 3))"
          done
          echo "::error::Could not push training status to master."
          exit 1
      # Pushes made by GITHUB_TOKEN intentionally do not trigger push Actions.
      - name: Redeploy the public site when counts changed
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy_pages.yml --repo "$GITHUB_REPOSITORY" --ref master
