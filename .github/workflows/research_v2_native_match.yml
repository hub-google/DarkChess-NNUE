name: 暗棋 V2｜原生對舊版棋力比較
run-name: 暗棋 V2｜原生對舊版棋力比較｜${{ github.run_number }}
on:
  push:
    branches: [research-v2]
    paths: ['arena/native_match.cjs','arena/aggregate_native.py','engine/search_cli.cpp','.github/workflows/research_v2_native_match.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v2-native-match-${{ github.ref }}
  cancel-in-progress: true
jobs:
  match:
    name: 等時間配對 ${{ matrix.ms }}ms｜${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - {ms: 25, seed: 24061101}
          - {ms: 25, seed: 24061102}
          - {ms: 25, seed: 24061103}
          - {ms: 25, seed: 24061104}
          - {ms: 25, seed: 24061105}
          - {ms: 25, seed: 24061106}
          - {ms: 25, seed: 24061107}
          - {ms: 25, seed: 24061108}
          - {ms: 100, seed: 24061201}
          - {ms: 100, seed: 24061202}
          - {ms: 100, seed: 24061203}
          - {ms: 100, seed: 24061204}
    steps:
      - uses: actions/checkout@v4
        name: 取得新版研究程式
      - uses: actions/checkout@v4
        name: 取得凍結的舊版引擎
        with:
          ref: 643218496863fef81612eab331c2b4d7a4255b12
          path: frozen
      - uses: actions/setup-node@v4
        name: 設定 Node
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        name: 設定獨立棋譜裁判
        with:
          python-version: '3.11'
      - name: 編譯同版權重的新舊引擎
        run: |
          npm ci --prefix frontend
          ./frontend/node_modules/.bin/tsc -p src/workers/tsconfig.selfplay.json
          ln -s "$PWD/frontend/node_modules" frozen/frontend/node_modules
          (cd frozen && ./frontend/node_modules/.bin/tsc -p src/workers/tsconfig.selfplay.json)
          g++ -std=c++20 -O3 -Wall -Wextra -Werror engine/search_cli.cpp -o /tmp/dc-cli
          pip install numpy numba
      - name: 同底牌、固定首翻、換邊十六組實戰
        run: |
          mkdir -p results
          node arena/native_match.cjs --pairs 16 --ms ${{ matrix.ms }} --seed ${{ matrix.seed }} --output results/native.json
      - name: Python 獨立重播全部完整對戰
        run: python -u src/training/validate_replay.py --directory results --min-games 32
      - uses: actions/upload-artifact@v4
        name: 保留配對報告與棋譜
        if: ${{ always() && !cancelled() }}
        with:
          name: native-match-${{ matrix.ms }}-${{ matrix.seed }}
          path: results/
          if-no-files-found: warn
          retention-days: 30
  report:
    name: 匯總棋力與效能證據
    needs: match
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        name: 取得統計程式
      - uses: actions/download-artifact@v4
        name: 取得所有配對資料
        with:
          pattern: native-match-*
          path: reports
      - name: 驗證完整固定樣本及計算五項分布
        run: python arena/aggregate_native.py reports native_match_summary.json
      - uses: actions/upload-artifact@v4
        name: 保存實驗結論
        with:
          name: native-match-summary
          path: native_match_summary.json
          if-no-files-found: error
