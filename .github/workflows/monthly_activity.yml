name: Monthly schedule keepalive (no files)

# GitHub can automatically disable scheduled workflows after long repository
# inactivity. Empty commits keep the public repository active without making
# garbage files or re-triggering other workflows with GITHUB_TOKEN pushes.
on:
  schedule:
    - cron: "43 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
      - name: Empty commit on current master, no content mutation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin master
            git checkout -B master origin/master
            git commit --allow-empty -m "chore: monthly Actions schedule keepalive"
            if git push origin master; then
              echo "[Keepalive] Updated repository activity; no file changed."
              exit 0
            fi
          done
          echo "::error::Unable to push empty heartbeat after three attempts."
          exit 1
