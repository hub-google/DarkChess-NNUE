name: 暗棋 02｜CPU 模型訓練
run-name: 暗棋 02｜CPU 模型訓練｜${{ github.run_number }}
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: 已驗證自我對弈 Run ID
        required: true
        type: string
      source_attempt:
        description: Run attempt
        default: '1'
        type: string
      recipe:
        description: 資料配方
        type: choice
        options: [new-only,mixed-teacher,mixed-outcomes]
        default: new-only
      allow_promotion:
        description: 棋力雙門檻通過後允許升級
        type: boolean
        default: false
  workflow_call:
    inputs:
      source_run:
        required: true
        type: string
      source_attempt:
        required: true
        type: string
      recipe:
        required: true
        type: string
      allow_promotion:
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
jobs:
  train:
    name: 固定 CPU 訓練及候選權重驗證
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 核對前置 Run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
          SOURCE_ATTEMPT: ${{ inputs.source_attempt }}
        run: python pipeline/check_source.py "$SOURCE_RUN" "$SOURCE_ATTEMPT" .github/workflows/self_play.yml
      - uses: actions/download-artifact@v4
        name: 取得已驗證新棋譜
        with:
          name: v2-verified-games-${{ inputs.source_attempt }}
          path: verified
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
      - name: CPU 訓練依賴
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: 確定相同初始模型與資料配方
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SOURCE_RUN: ${{ inputs.source_run }}
          SOURCE_ATTEMPT: ${{ inputs.source_attempt }}
          RECIPE: ${{ inputs.recipe }}
        run: python -u pipeline/release.py train verified experiment "$SOURCE_RUN" "$SOURCE_ATTEMPT" "$RECIPE"
      - uses: actions/upload-artifact@v4
        name: 保存候選、基準及來源雜湊
        with:
          name: v2-candidate-${{ github.run_attempt }}
          path: experiment/
          if-no-files-found: error
          retention-days: 30
      - name: 產生真實訓練報告
        run: |
          echo '## 固定 CPU 工作量訓練；尚未升級冠軍' >> "$GITHUB_STEP_SUMMARY"
          python -c 'import json;print(json.dumps(json.load(open("experiment/training.json"))["fit"],indent=2))' >> "$GITHUB_STEP_SUMMARY"
  arena:
    name: 接續固定樣本棋力驗證
    needs: train
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/arena.yml
    with:
      training_run: ${{ format('{0}',github.run_id) }}
      training_attempt: ${{ format('{0}',github.run_attempt) }}
      allow_promotion: ${{ inputs.allow_promotion }}
    secrets: inherit
