name: 🤖 NNUE 神經網路自主訓練與評測流程 (Autonomous Training Pipeline)

# 觸發條件：每天午夜定時執行，或手動點擊觸發
on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 00:00 (台灣時間 08:00) 自動執行
  workflow_dispatch: # 支援在 GitHub Actions 介面手動觸發

concurrency:
  group: train
  cancel-in-progress: true

jobs:
  train-and-update:
    name: 🏋️ 模型訓練與直接更新
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: 📥 步驟 1：檢出專案程式碼 (Checkout Code)
      uses: actions/checkout@v4
      
    - name: 🐍 步驟 2：設定 Python 執行環境 (Python 3.10)
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: 📦 步驟 3：安裝 Python 相依套件 (requirements.txt)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: 🔄 步驟 4：整合與重播緩衝區數據 (Consolidate Replay Buffer)
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        echo "［進行中］整合 Hugging Face 上的暫存資料，維持 50 萬筆最新高質量 Replay Buffer..."
        python -u src/training/consolidate_buffer.py

    - name: 📥 步驟 5：下載最新 50 萬筆 Replay Buffer 訓練集
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        echo "［進行中］從 Hugging Face 下載整合好的 Replay Buffer 至本地 datasets/ 目錄..."
        mkdir -p datasets
        python -c "from huggingface_hub import hf_hub_download; import os, shutil; path = hf_hub_download(repo_id='hub-google/DarkChess-NNUE-Data', repo_type='dataset', filename='replay_buffer.jsonl.gz'); shutil.copy(path, 'datasets/replay_buffer.jsonl.gz')"
        
    - name: 🧠 步驟 6：執行 Phase 2 - NNUE 模型神經網路訓練
      run: |
        echo "［進行中］開始訓練全新的挑戰者模型 (models/challenger.nnue)..."
        python -u src/training/train.py
        
    - name: 🏆 步驟 7：無條件晉升模型與 Git 自動 Commit 提交
      run: |
        echo "［成功］由於是前期階段，跳過 SPRT 測試，新模型無條件晉升為衛冕者！"
        mv models/challenger.nnue models/champion.nnue
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add models/champion.nnue
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: 自動更新 NNUE 衛冕者模型 (Champion Model)" && git push)
