name: NNUE Autonomous Training Pipeline

on:
  schedule:
    - cron: '0 0 * * *' # Run nightly at midnight
  workflow_dispatch: # Allow manual trigger

jobs:
  train-and-validate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Configure AWS Credentials for Cloudflare R2
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        aws-region: auto
        
    - name: Download Replay Buffer
      run: |
        mkdir -p datasets
        # Download the latest replay buffer datasets (jsonl.gz files) from R2
        aws s3 cp s3://${{ secrets.R2_BUCKET_NAME }}/datasets/ datasets/ --recursive --endpoint-url ${{ secrets.R2_ENDPOINT_URL }}
        
    - name: Run Phase 2 Training Loop
      run: |
        echo "Running NNUE Phase 2 Training..."
        # This will train on the datasets/ directory and output models/challenger.nnue
        python src/training/train.py
        
    - name: Run Phase 3 SPRT Validation
      id: sprt
      run: |
        echo "Running SPRT Validation..."
        # python src/training/sprt_validation.py --champion models/champion.nnue --challenger models/challenger.nnue
        # MOCK PASS FOR ARCHITECTURE VALIDATION
        echo "PASSED=true" >> $GITHUB_ENV
        
    - name: Run Phase 4 Promotion and Commit
      if: env.PASSED == 'true'
      run: |
        echo "SPRT passed. Promoting challenger to champion."
        # mv models/challenger.nnue models/champion.nnue
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add models/
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update NNUE champion model" && git push)
