name: 暗棋 V2｜原生棋規及 NNUE
run-name: 暗棋 V2｜原生棋規及 NNUE｜${{ github.run_number }}
on:
  push:
    branches: [research-v2]
    paths: ['engine/nnue_delta.hpp','engine/exact_cache.hpp','engine/benchmark_variants.py','engine/board.hpp','engine/nnue.hpp','engine/search.hpp','engine/corpus.cjs','engine/parity.cpp','engine/search_corpus.cjs','engine/search_parity.cpp','.github/workflows/research_v2_native.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v2-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        name: 取得研究程式
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 編譯參考引擎與產生逐手測試
        run: |
          npm ci --prefix frontend
          ./frontend/node_modules/.bin/tsc -p src/workers/tsconfig.selfplay.json
          node engine/corpus.cjs
      - name: 驗證原生棋規與增量推論
        run: |
          set -euo pipefail
          g++ -std=c++20 -O3 -Wall -Wextra -Werror engine/parity.cpp -o /tmp/dc-parity
          /tmp/dc-parity frontend/public/models/champion.bin < engine/corpus.txt | tee engine/parity.json
      - name: 驗證機率搜尋根節點、預算與合法 fallback
        run: |
          set -euo pipefail
          node engine/search_corpus.cjs
          g++ -std=c++20 -O3 -Wall -Wextra -Werror engine/search_parity.cpp -o /tmp/dc-search
          /tmp/dc-search frontend/public/models/champion.bin < engine/search_corpus.txt | tee engine/search_parity.json
      - name: 同 CPU 實測稀疏更新、精確置換表及主機 SIMD 編譯
        run: |
          set -euo pipefail
          for v in reference delta tt combined native_simd; do
            flags=()
            case "$v" in
              delta) flags+=(-DDC_EXPERIMENTAL_DELTA);;
              tt) flags+=(-DDC_EXPERIMENTAL_TT);;
              combined) flags+=(-DDC_EXPERIMENTAL_DELTA -DDC_EXPERIMENTAL_TT);;
              native_simd) flags+=(-DDC_EXPERIMENTAL_DELTA -DDC_EXPERIMENTAL_TT -march=native);;
            esac
            g++ -std=c++20 -O3 -Wall -Wextra -Werror "${flags[@]}" engine/search_parity.cpp -o "/tmp/dc-$v"
          done
          python engine/benchmark_variants.py frontend/public/models/champion.bin engine/search_corpus.txt engine/variant_benchmark.json
      - name: 紀錄實測結果
        run: |
          echo '## C++ 逐手等價與 NNUE 誤差' >> "$GITHUB_STEP_SUMMARY"
          echo '只代表研究核心正確性，不代表完整棋力或正式部署。' >> "$GITHUB_STEP_SUMMARY"
          cat engine/parity.json >> "$GITHUB_STEP_SUMMARY"
          echo '## 機率搜尋根估值' >> "$GITHUB_STEP_SUMMARY"
          cat engine/search_parity.json >> "$GITHUB_STEP_SUMMARY"
          echo '## 搜尋等價微基準（未直接啟用實驗最佳化）' >> "$GITHUB_STEP_SUMMARY"
          cat engine/variant_benchmark.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: native-parity
          path: |
            engine/parity.json
            engine/search_parity.json
            engine/variant_benchmark.json
          if-no-files-found: error
