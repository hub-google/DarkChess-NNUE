name: HF Write Probe
on:
  push:
    paths:
      - '.github/workflows/hf_probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install HF SDK
        run: pip install 'huggingface_hub>=0.34,<3'
      - name: Write read verify and delete temporary probe
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import os,hashlib,tempfile,pathlib
          from huggingface_hub import HfApi,hf_hub_download
          token=os.environ['HF_TOKEN']
          repo='hub-google/DarkChess-NNUE-Data'
          path='diagnostics/probes/'+os.environ['GITHUB_RUN_ID']+'.txt'
          data=b'DarkChess HF temporary write verification\n'
          api=HfApi(token=token)
          created=False
          with tempfile.TemporaryDirectory() as d:
              p=pathlib.Path(d)/'test.txt';p.write_bytes(data)
              try:
                  api.upload_file(path_or_fileobj=str(p),path_in_repo=path,repo_id=repo,repo_type='dataset',commit_message='test: temporary HF write probe')
                  created=True
                  print('WRITE=PASS',flush=True)
                  q=hf_hub_download(repo_id=repo,repo_type='dataset',filename=path,token=token,force_download=True,local_dir=d)
                  assert pathlib.Path(q).read_bytes()==data
                  print('READBACK_SHA256=PASS '+hashlib.sha256(data).hexdigest(),flush=True)
              finally:
                  if created:
                      api.delete_file(path_in_repo=path,repo_id=repo,repo_type='dataset',commit_message='test: remove HF probe')
                      print('DELETE=PASS',flush=True)
          PY
