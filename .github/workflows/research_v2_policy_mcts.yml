name: 暗棋 V2｜Policy 與 MCTS 實戰
run-name: 暗棋 V2｜Policy 與 MCTS 實戰｜${{ github.run_number }}
on:
  push:
    branches: [research-v2]
    paths: ['engine/monte_carlo.hpp','engine/monte_match.cpp','research_v2/train_policy.py','research_v2/monte_report.py','.github/workflows/research_v2_policy_mcts.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: v2-policy-mcts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    name: 訓練公開盤面走法預測
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: native-selfplay-dataset
          path: new-data
          run-id: 45322104178
          github-token: ${{ github.token }}
      - name: 安裝 CPU 訓練套件
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy numba
      - name: 固定訓練和保留局並匯出權重
        run: python -u research_v2/train_policy.py new-data policy
      - uses: actions/upload-artifact@v4
        with:
          name: public-policy-pilot
          path: policy/
          if-no-files-found: error
  matches:
    name: ${{ matrix.a }} 對 ${{ matrix.b }}｜${{ matrix.seed }}
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {a: expecti, b: mcts, seed: 8101}
          - {a: expecti, b: mcts, seed: 8102}
          - {a: expecti, b: mcts, seed: 8103}
          - {a: expecti, b: mcts, seed: 8104}
          - {a: expecti, b: puct, seed: 8201}
          - {a: expecti, b: puct, seed: 8202}
          - {a: expecti, b: puct, seed: 8203}
          - {a: expecti, b: puct, seed: 8204}
          - {a: mcts, b: puct, seed: 8301}
          - {a: mcts, b: puct, seed: 8302}
          - {a: mcts, b: puct, seed: 8303}
          - {a: mcts, b: puct, seed: 8304}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: public-policy-pilot
          path: policy
      - name: 核對模型及編譯候選搜尋器
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          for folder,name in [('frontend/public/models','champion'),('policy','policy')]:
              p=Path(folder)
              b=(p/(name+'.bin')).read_bytes()
              m=json.loads((p/(name+'.json')).read_text())
              assert len(b)==m['bytes'] and hashlib.sha256(b).hexdigest()==m['sha256']
          PY
          g++ -std=c++20 -O3 -Wall -Wextra -Werror engine/monte_match.cpp -o /tmp/dc-monte
          pip install numpy numba
      - name: 固定 25ms、同底牌及換邊實戰
        run: |
          set -euo pipefail
          mkdir -p results
          /tmp/dc-monte frontend/public/models/champion.bin policy/policy.bin ${{ matrix.a }} ${{ matrix.b }} ${{ matrix.seed }} 16 25 results/match.jsonl | tee results/match.json
          gzip -n results/match.jsonl
          python -u src/training/validate_replay.py --directory results --min-games 32
      - uses: actions/upload-artifact@v4
        with:
          name: monte-${{ matrix.a }}-${{ matrix.b }}-${{ matrix.seed }}
          path: results/
          if-no-files-found: error
  report:
    name: 匯總固定樣本棋力及時間證據
    needs: matches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: monte-*
          path: reports
      - name: 配對比較
        run: |
          python research_v2/monte_report.py reports monte_summary.json
          cat monte_summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: monte-summary
          path: monte_summary.json
          if-no-files-found: error
