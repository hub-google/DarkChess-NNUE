name: CPU paired-arena baseline

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "src/training/arena.py"
      - "src/training/sprt_validation.py"
      - "test/test_arena.py"
      - ".github/workflows/arena.yml"

jobs:
  cpu-arena:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install CPU dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Run paired champion against material baseline
        env:
          TORCH_NUM_THREADS: "1"
        run: |
          python -u src/training/arena.py \
            --candidate models/champion.nnue \
            --baseline material \
            --pairs 2 \
            --depth 3 \
            --node-budget 250 \
            --max-seconds 0.15 \
            --output arena_results.json
      - uses: actions/upload-artifact@v4
        with:
          name: arena-${{ github.sha }}
          path: arena_results.json
          retention-days: 30
