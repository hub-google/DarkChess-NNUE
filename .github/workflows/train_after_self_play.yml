name: Train only after successful full self-play

# Event-driven bridge for manual 15-worker self-play.
# Regular 4-worker scheduled cycles feed the independent daily train cron,
# avoiding four expensive training runs per day.
on:
  workflow_run:
    workflows: ["Distributed belief-state self-play"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dispatch-training:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'schedule') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch protected production training workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run train.yml --repo "$GITHUB_REPOSITORY" --ref master
          echo "[Train Bridge] Dispatched train.yml with MIN_TRAINING_GAMES=1000, SPRT promotion gate."
