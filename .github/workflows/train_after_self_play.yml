name: Train after enough continuous self-play

# The 6-hour/one-day fixed training cron is a fallback. This completion
# bridge makes training event-driven even when GitHub delays scheduled jobs.
on:
  workflow_run:
    workflows: ["Distributed belief-state self-play"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: training-dispatch-throttle
  cancel-in-progress: false

jobs:
  dispatch-training:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch training when no training started recently
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            # Self-play rounds last about one hour. Training every completed
            # round would backlog 6-hour CPU jobs indefinitely. Start at most
            # one event-driven training job in any rolling 6-hour interval.
            LAST_TRAIN=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/train.yml/runs?per_page=1" --jq '.workflow_runs[0].created_at // ""')
            if [ -n "$LAST_TRAIN" ]; then
              AGE=$(( $(date -u +%s) - $(date -u -d "$LAST_TRAIN" +%s) ))
              if [ "$AGE" -ge 0 ] && [ "$AGE" -lt 21600 ]; then
                echo "[Training Bridge] Last train dispatched ${AGE}s ago; next eligible after 6 hours."
                exit 0
              fi
            fi
          fi
          gh workflow run train.yml --repo "$GITHUB_REPOSITORY" --ref master
          echo "[Training Bridge] Dispatched real HF consolidation, NNUE training and SPRT."
