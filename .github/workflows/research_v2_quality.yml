name: 暗棋 V2｜重構回歸驗證
run-name: 暗棋 V2｜重構回歸驗證｜${{ github.run_number }}
on:
  push:
    branches: [research-v2]
    paths-ignore: ['research_v2/metrics/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-v2-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    name: 網頁與共用引擎測試
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        name: 取得程式
      - uses: actions/setup-node@v4
        name: 設定 Node
        with:
          node-version: 24
      - name: 安裝依賴
        run: npm ci --prefix frontend
      - name: 網頁及搜尋回歸
        run: npm test --prefix frontend -- --run
      - name: 編譯網站
        run: npm run build --prefix frontend
      - name: 編譯共用 CPU 引擎
        run: ./frontend/node_modules/.bin/tsc -p src/workers/tsconfig.selfplay.json
  python:
    name: CPU 裁判、資料、訓練與流程回歸
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        name: 取得程式
      - uses: actions/setup-python@v5
        name: 設定 Python
        with:
          python-version: '3.11'
      - name: 安裝 CPU 訓練套件
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Python 回歸測試
        run: python -m unittest discover -s test -p 'test_*.py' -v
      - name: 配對統計測試
        run: python -m unittest discover -s arena -p 'test_*.py' -v
