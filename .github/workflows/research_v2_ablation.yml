name: 暗棋 V2｜新舊棋譜訓練消融
run-name: 暗棋 V2｜新舊棋譜訓練消融｜${{ github.run_number }}
on:
  push:
    branches: [research-v2]
    paths: ['research_v2/train_ablation.py','research_v2/ablation_report.py','engine/model_match.cpp','.github/workflows/research_v2_ablation.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: v2-replay-ablation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  train:
    name: 相同 CPU 工作量訓練三組候選模型
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        name: 取得程式與初始冠軍
      - uses: actions/setup-python@v5
        name: 設定 CPU Python
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        name: 下載已驗證 240 局訓練專用棋譜
        with:
          name: native-selfplay-dataset
          path: new-data
          run-id: 45322104178
          github-token: ${{ github.token }}
      - name: 安裝 CPU 訓練套件
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy numba huggingface_hub
      - name: 讀取固定 HF 舊資料快照並訓練三組
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u research_v2/train_ablation.py --new new-data --output experiment
      - uses: actions/upload-artifact@v4
        name: 保存候選模型與實際訓練報告
        with:
          name: ablation-models
          path: experiment/
          if-no-files-found: error
          retention-days: 30
  match:
    name: 配對棋力 ${{ matrix.comparison }}｜${{ matrix.seed }}
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - {comparison: base-A, base: base, candidate: A, seed: 7101}
          - {comparison: base-A, base: base, candidate: A, seed: 7102}
          - {comparison: base-A, base: base, candidate: A, seed: 7103}
          - {comparison: base-A, base: base, candidate: A, seed: 7104}
          - {comparison: base-B, base: base, candidate: B, seed: 7201}
          - {comparison: base-B, base: base, candidate: B, seed: 7202}
          - {comparison: base-B, base: base, candidate: B, seed: 7203}
          - {comparison: base-B, base: base, candidate: B, seed: 7204}
          - {comparison: base-C, base: base, candidate: C, seed: 7301}
          - {comparison: base-C, base: base, candidate: C, seed: 7302}
          - {comparison: base-C, base: base, candidate: C, seed: 7303}
          - {comparison: base-C, base: base, candidate: C, seed: 7304}
          - {comparison: A-B, base: A, candidate: B, seed: 7401}
          - {comparison: A-B, base: A, candidate: B, seed: 7402}
          - {comparison: A-B, base: A, candidate: B, seed: 7403}
          - {comparison: A-B, base: A, candidate: B, seed: 7404}
          - {comparison: A-C, base: A, candidate: C, seed: 7501}
          - {comparison: A-C, base: A, candidate: C, seed: 7502}
          - {comparison: A-C, base: A, candidate: C, seed: 7503}
          - {comparison: A-C, base: A, candidate: C, seed: 7504}
    steps:
      - uses: actions/checkout@v4
        name: 取得原生搜尋與裁判
      - uses: actions/setup-python@v5
        name: 設定獨立裁判
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        name: 取得固定模型
        with:
          name: ablation-models
          path: experiment
      - name: 編譯並核對模型權重
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          for name in ('base','A','B','C'):
              p=Path('experiment')/name
              m=json.loads((p/'champion.json').read_text())
              b=(p/'champion.bin').read_bytes()
              assert len(b)==m['bytes'] and hashlib.sha256(b).hexdigest()==m['sha256']
          PY
          g++ -std=c++20 -O3 -Wall -Wextra -Werror engine/model_match.cpp -o /tmp/dc-model-match
          pip install numpy numba
      - name: 固定獨立種子與同底牌換邊
        run: |
          set -euo pipefail
          mkdir -p results
          /tmp/dc-model-match experiment/${{ matrix.base }}/champion.bin experiment/${{ matrix.candidate }}/champion.bin ${{ matrix.seed }} 32 25 results/match.jsonl | tee results/match.json
          gzip -n results/match.jsonl
          python -u src/training/validate_replay.py --directory results --min-games 64
      - uses: actions/upload-artifact@v4
        name: 保存對戰報告及完整棋譜
        with:
          name: ablation-${{ matrix.comparison }}-${{ matrix.seed }}
          path: results/
          if-no-files-found: error
          retention-days: 30
  report:
    name: 匯總訓練及五組棋力實驗
    needs: match
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        name: 取得統計程式
      - uses: actions/download-artifact@v4
        name: 取得所有對戰報告
        with:
          pattern: ablation-*-*
          path: reports
      - uses: actions/download-artifact@v4
        name: 取得訓練報告
        with:
          name: ablation-models
          path: experiment
      - name: 驗證固定樣本並匯總統計
        run: |
          python research_v2/ablation_report.py reports experiment/training.json ablation_summary.json
          cat ablation_summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        name: 保存實測消融結果
        with:
          name: ablation-summary
          path: ablation_summary.json
          if-no-files-found: error
