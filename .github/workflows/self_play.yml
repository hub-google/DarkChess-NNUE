name: Continuous self-play and recovery

# One workflow owns the continuous CPU self-play loop, hourly recovery,
# and monthly schedule keepalive.
on:
  workflow_dispatch:
    # Accept the input still sent by an already-running pre-migration round.
    inputs:
      continuous:
        description: "Backward-compatible flag; all runs are continuous"
        type: boolean
        required: false
        default: true
  schedule:
    - cron: "23 * * * *"
    - cron: "43 3 1 * *"
  push:
    branches: [master]
    paths:
      - ".github/workflows/self_play.yml"

permissions:
  contents: write
  actions: write

# The watchdog must run while a long self-play round is still active.
concurrency:
  group: self-play-${{ github.event_name == 'workflow_dispatch' && 'round' || 'watchdog' }}
  cancel-in-progress: false

jobs:
  self-play-worker:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # GitHub-hosted jobs have a six-hour maximum. Cap the entire job at
    # 5h55m and reserve >=15 minutes for checkout, Python/PyTorch installation,
    # upload retries and artifact cleanup after the 5h40m generation window.
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        # Fixed four-worker nonstop self-play.
        worker_id: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Generate and upload self-play
        env:
          WORKER_ID: ${{ matrix.worker_id }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          BATCH_SIZE: "10"
          NUM_BATCHES: "1"
          SELF_PLAY_TEMPERATURE: "0.8"
          EXPLORE_PLIES: "20"
          SEARCH_MAX_SECONDS: "3.0"
          POLICY_PRIOR_MIX: "0.15"
          OPENING_SEARCH_DEPTH: "1"
          SEARCH_NODE_BUDGET_EARLY: "500"
          SEARCH_NODE_BUDGET_MID: "1200"
          SEARCH_NODE_BUDGET_LATE: "2500"
          TORCH_NUM_THREADS: "1"
          # Generate for 5h40m. GitHub jobs are limited to six
          # hours including setup and uploads; don't waste CPU restarting hourly.
          GENERATION_WINDOW_SECONDS: "20400"
          BOOTSTRAP_OPPONENT_PROBABILITY: "0.25"
        run: |
          mkdir -p output_data
          export DATE_STR
          DATE_STR=$(date +%Y%m%d)
          
          START_TIME=$(date +%s)
          # 5h40m of generation per round. Persist completed games per
          # batch; allow time for final HF uploads and worker teardown.
          GENERATION_BUDGET="${GENERATION_WINDOW_SECONDS}"
          UPLOADED_BATCHES=0
          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))
            REMAINING=$((GENERATION_BUDGET - ELAPSED))
            if [ "$REMAINING" -le 120 ]; then
              echo "Generation window exhausted after $ELAPSED seconds."
              break
            fi
            
            echo "Starting new batch. Elapsed: ${ELAPSED}s; remaining: ${REMAINING}s."
            # Keep two minutes for uploading completed games and runner cleanup.
            set +e
            timeout --signal=TERM --kill-after=30s "$((REMAINING - 120))s" \
              python -u src/workers/self_play.py
            SELF_PLAY_STATUS=$?
            set -e
            if compgen -G "output_data/*.jsonl.gz" > /dev/null; then
              python -u src/workers/upload_batch.py
              UPLOADED_BATCHES=$((UPLOADED_BATCHES + 1))
            elif [ "$SELF_PLAY_STATUS" -eq 124 ] && [ "$UPLOADED_BATCHES" -gt 0 ]; then
              # Last in-progress game was killed at the time limit, but all
              # previous complete batches are already safe in HF. Not a failure.
              echo "[Self-Play] Clean time limit: earlier batches uploaded; no new completed game."
              break
            else
              echo "::error::No complete replay in this batch (exit=$SELF_PLAY_STATUS)."
              exit 1
            fi

            if [ "$SELF_PLAY_STATUS" -eq 124 ]; then
              echo "Batch reached the generation deadline; uploaded completed games."
              break
            elif [ "$SELF_PLAY_STATUS" -ne 0 ]; then
              echo "Self-play failed with exit code $SELF_PLAY_STATUS."
              exit "$SELF_PLAY_STATUS"
            fi
          done
          if [ "$UPLOADED_BATCHES" -eq 0 ]; then
            echo "::error::No completed batches were uploaded in this worker's window."
            exit 1
          fi

      - name: Preserve data if upload failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: self-play-recovery-${{ matrix.worker_id }}-${{ github.run_id }}
          path: output_data/
          if-no-files-found: ignore
          retention-days: 7

  continue-next-cycle:
    needs: self-play-worker
    if: ${{ always() && needs.self-play-worker.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Continue self-play immediately and train at most once per six hours
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Start the next self-play round before any optional training work.
          gh workflow run self_play.yml --repo "$GITHUB_REPOSITORY" --ref master
          echo "[Autonomy] Next four-worker self-play round dispatched."

          LAST_TRAIN=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/train.yml/runs?per_page=1" --jq '.workflow_runs[0].created_at // ""')
          if [ -n "$LAST_TRAIN" ]; then
            AGE=$(( $(date -u +%s) - $(date -u -d "$LAST_TRAIN" +%s) ))
            if [ "$AGE" -ge 0 ] && [ "$AGE" -lt 21600 ]; then
              echo "[Autonomy] Training dispatched ${AGE}s ago; no duplicate."
              exit 0
            fi
          fi
          gh workflow run train.yml --repo "$GITHUB_REPOSITORY" --ref master
          echo "[Autonomy] NNUE training dispatched."

  recovery-watchdog:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restart self-play only when no round is active
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Exclude scheduled and push-triggered watchdog runs from this count.
          ACTIVE=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/self_play.yml/runs?per_page=100" \
            --jq '[.workflow_runs[] | select(.event == "workflow_dispatch" and .status != "completed")] | length')
          if [ "$ACTIVE" -gt 0 ]; then
            echo "[Watchdog] ${ACTIVE} active self-play run(s); no duplicate."
            exit 0
          fi
          gh workflow run self_play.yml --repo "$GITHUB_REPOSITORY" --ref master
          echo "[Watchdog] Restarted four-worker continuous self-play."

      - name: Checkout for monthly keepalive
        if: ${{ github.event_name == 'schedule' && github.event.schedule == '43 3 1 * *' }}
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Keep scheduled Actions active with an empty commit
        if: ${{ github.event_name == 'schedule' && github.event.schedule == '43 3 1 * *' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin master
            git checkout -B master origin/master
            git commit --allow-empty -m "chore: monthly Actions schedule keepalive"
            if git push origin master; then
              echo "[Keepalive] Updated repository activity without changing files."
              exit 0
            fi
          done
          echo "::error::Unable to push monthly keepalive after three attempts."
          exit 1
