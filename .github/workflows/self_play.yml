name: Distributed belief-state self-play

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: self-play
  cancel-in-progress: true

jobs:
  self-play-worker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker_id: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate and upload self-play
        env:
          WORKER_ID: ${{ matrix.worker_id }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          BATCH_SIZE: "20"
          NUM_BATCHES: "10"
          MAX_SEARCH_DEPTH: "1"
          SELF_PLAY_TEMPERATURE: "0.8"
          EXPLORE_PLIES: "20"
        run: |
          mkdir -p output_data
          export DATE_STR
          DATE_STR=$(date +%Y%m%d)
          python -u src/workers/self_play.py
          python -u src/workers/upload_batch.py

      - name: Preserve data if upload failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: self-play-recovery-${{ matrix.worker_id }}-${{ github.run_id }}
          path: output_data/
          if-no-files-found: ignore
          retention-days: 7
