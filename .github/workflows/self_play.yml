name: Continuous self-play and recovery

# Five sequential waves per RUN; each wave = 15 CPU workers + one HF writer.
on:
  workflow_dispatch:
    inputs:
      continuous:
        description: "Backward-compatible flag; full five-wave run"
        type: boolean
        default: true
        required: false
  schedule:
    - cron: "23 * * * *"
    - cron: "43 3 1 * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: self-play-v2-${{ github.event_name == 'workflow_dispatch' && 'round' || 'watchdog' }}
  cancel-in-progress: false

jobs:
  wave1:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/self_play_wave.yml
    with:
      wave: 1
    secrets: inherit

  wave2:
    needs: wave1
    # Do not discard four subsequent waves when a single CPU worker fails.
    # Each wave's sole HF writer independently verifies durable batches.
    if: ${{ always() && !cancelled() && github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/self_play_wave.yml
    with:
      wave: 2
    secrets: inherit

  wave3:
    needs: wave2
    # Do not discard four subsequent waves when a single CPU worker fails.
    # Each wave's sole HF writer independently verifies durable batches.
    if: ${{ always() && !cancelled() && github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/self_play_wave.yml
    with:
      wave: 3
    secrets: inherit

  wave4:
    needs: wave3
    # Do not discard four subsequent waves when a single CPU worker fails.
    # Each wave's sole HF writer independently verifies durable batches.
    if: ${{ always() && !cancelled() && github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/self_play_wave.yml
    with:
      wave: 4
    secrets: inherit

  wave5:
    needs: wave4
    # Do not discard four subsequent waves when a single CPU worker fails.
    # Each wave's sole HF writer independently verifies durable batches.
    if: ${{ always() && !cancelled() && github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/self_play_wave.yml
    with:
      wave: 5
    secrets: inherit

  continue-next-cycle:
    needs: wave5
    if: ${{ always() && !cancelled() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start next run then dispatch training if last train was over six hours ago
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Never spin up another costly round if all five central HF writers
          # failed. An hourly watchdog can retry after HF/auth is repaired.
          VERIFIED_WRITERS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name | contains("worker 16 HF writer")) | select(.conclusion == "success")] | length')
          if [ "$VERIFIED_WRITERS" -eq 0 ]; then
            echo "::error::Zero verified HF writers in this run; refusing an endless failing loop."
            exit 1
          fi
          echo "[Autonomy] $VERIFIED_WRITERS verified upload waves; safe to continue."
          gh workflow run self_play.yml --repo "$GITHUB_REPOSITORY" --ref master
          echo "[Autonomy] Dispatched next five-wave run."
          LAST_TRAIN=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/train.yml/runs?per_page=1" --jq '.workflow_runs[0].created_at // ""')
          if [ -n "$LAST_TRAIN" ]; then
            AGE=$(( $(date -u +%s) - $(date -u -d "$LAST_TRAIN" +%s) ))
            if [ "$AGE" -ge 0 ] && [ "$AGE" -lt 21600 ]; then
              echo "[Autonomy] Training already dispatched ${AGE}s ago."
              exit 0
            fi
          fi
          gh workflow run train.yml --repo "$GITHUB_REPOSITORY" --ref master
          echo "[Autonomy] NNUE training dispatched."

  recovery-watchdog:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restart self-play only when no round is active
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Earlier runs may still use the retired four-worker layout.
          # Do not let them prevent the first 15-worker run from starting.
          ACTIVE_IDS=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/self_play.yml/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.event == "workflow_dispatch" and .status != "completed") | .id')
          FOUND_NEW=0
          # Inspect ALL active runs before deciding. Previously an early return
          # on the new run left the old four-worker jobs wasting free runners.
          for active_id in $ACTIVE_IDS; do
            JOBS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$active_id/jobs?per_page=100")
            LEGACY_JOBS=$(jq '[.jobs[] | select(.name | startswith("self-play-worker"))] | length' <<< "$JOBS")
            if [ "$LEGACY_JOBS" -gt 0 ]; then
              echo "[Watchdog] Cancelling obsolete four-worker run $active_id."
              gh run cancel "$active_id" --repo "$GITHUB_REPOSITORY" || true
              continue
            fi
            WAVE_JOBS=$(jq '[.jobs[] | select(.name | contains(" / Wave "))] | length' <<< "$JOBS")
            if [ "$WAVE_JOBS" -gt 0 ]; then
              echo "[Watchdog] Current 15-worker round $active_id is active."
              FOUND_NEW=1
              continue
            fi
            CREATED=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$active_id" --jq '.created_at')
            AGE=$(( $(date -u +%s) - $(date -u -d "$CREATED" +%s) ))
            if [ "$AGE" -lt 1200 ]; then
              echo "[Watchdog] Recent round $active_id is still starting."
              FOUND_NEW=1
              continue
            fi
            echo "[Watchdog] Stale uninitialized round $active_id observed; new dispatch will recover."
          done
          if [ "$FOUND_NEW" -gt 0 ]; then
            exit 0
          fi
          gh workflow run self_play.yml --repo "$GITHUB_REPOSITORY" --ref master
          echo "[Watchdog] Restarted fifteen-worker continuous self-play."

      - name: Checkout for monthly keepalive
        if: ${{ github.event_name == 'schedule' && github.event.schedule == '43 3 1 * *' }}
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Keep scheduled Actions active with an empty commit
        if: ${{ github.event_name == 'schedule' && github.event.schedule == '43 3 1 * *' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin master
            git checkout -B master origin/master
            git commit --allow-empty -m "chore: monthly Actions schedule keepalive"
            if git push origin master; then
              echo "[Keepalive] Updated repository activity without changing files."
              exit 0
            fi
          done
          echo "::error::Unable to push monthly keepalive after three attempts."
          exit 1
