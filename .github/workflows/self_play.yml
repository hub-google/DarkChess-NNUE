  continue-next-cycle:
    needs: [wave1-upload, wave2-upload, wave3-upload, wave4-upload, wave5-upload]
    if: ${{ always() && !cancelled() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 清理已完成的舊執行紀錄
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/prune_action_runs.py --scope all
      - name: 確認上傳結果並接續下一輪
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_STATUSES: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          VERIFIED_WRITERS=$(jq -n --argjson needs "$UPLOAD_STATUSES" \
            '$needs | [.[] | select(.outputs.uploaded == "true")] | length')
          if [ "$VERIFIED_WRITERS" -eq 0 ]; then
            echo "[Autonomy] No completed depth-12 games this round; only checkpoints saved."
          fi
          # A cancelled round is never permitted to dispatch its successor.
          CURRENT_STATUS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.status')
          if [ "$CURRENT_STATUS" != "in_progress" ]; then
            echo "::notice::Parent run not active ($CURRENT_STATUS); stop continuation."
            exit 0
          fi
          echo "[Autonomy] $VERIFIED_WRITERS upload waves verified."
          LAST_TRAIN=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/train.yml/runs?per_page=40" \
            --jq '[.workflow_runs[] | select(.event != "push")][0].created_at // ""')
          if [ "$VERIFIED_WRITERS" -gt 0 ] && { [ -z "$LAST_TRAIN" ] || [ $(( $(date -u +%s) - $(date -u -d "$LAST_TRAIN" +%s) )) -ge 21600 ]; }; then
            gh workflow run train.yml --repo "$GITHUB_REPOSITORY" --ref master
            echo "[Autonomy] Production NNUE training dispatched."
          fi
          gh workflow run self_play.yml --repo "$GITHUB_REPOSITORY" --ref master
          echo "[Autonomy] Next five-wave round dispatched."

  recovery-watchdog:
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '23 * * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: 清理已完成的舊執行紀錄
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/prune_action_runs.py --scope all
      - name: 僅恢復未被手動取消的對弈
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Manual cancellation means PAUSED, until the user dispatches a round.
          # This persists without a separate repository variable or workflow.
          RECENT=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/self_play.yml/runs?event=workflow_dispatch&per_page=1")
          LATEST_STATUS=$(jq -r '.workflow_runs[0].status // ""' <<< "$RECENT")
          LATEST_RESULT=$(jq -r '.workflow_runs[0].conclusion // ""' <<< "$RECENT")
          if [ "$LATEST_STATUS" = "completed" ] && [ "$LATEST_RESULT" = "cancelled" ]; then
            echo "::notice::Self-play deliberately cancelled; watchdog stays paused."
            exit 0
          fi
          ACTIVE=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/self_play.yml/runs?per_page=100" \
            --jq '[.workflow_runs[] | select(.event == "workflow_dispatch" and .status != "completed")] | length')
          if [ "$ACTIVE" -gt 0 ]; then
            echo "[Watchdog] $ACTIVE round(s) already active; no duplicate dispatch."
            exit 0
          fi
          gh workflow run self_play.yml --repo "$GITHUB_REPOSITORY" --ref master
          echo "[Watchdog] Started one new self-play round."

  maintenance:
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '17 */3 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 58
    concurrency:
      group: darkchess-hf-stage-writer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 安裝資料復原與統計工具
        run: pip install numpy numba huggingface_hub
      - name: 補傳先前上傳失敗的棋譜
        env:
          GH_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MAX_RECOVERY_GROUPS: "4"
        run: python -u src/workers/recover_failed_uploads.py
      - name: 僅清理已安全備份的完成紀錄
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python .github/scripts/prune_action_runs.py --scope all
      - name: 統計已驗證且不重複的對弈局數
        if: ${{ always() && !cancelled() }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u .github/scripts/publish_training_status.py
      - name: 安全發布最新訓練狀態
        if: ${{ always() && !cancelled() }}
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/training-status.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: publish verified self-play progress"
          for attempt in 1 2 3 4 5; do
            git fetch origin master
            if ! git rebase origin/master; then
              git rebase --abort || true
              echo "::error::Training status conflict; existing data preserved."
              exit 1
            fi
            if git push origin HEAD:master; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep "$((attempt * 3))"
          done
          echo "::error::Could not push verified counters."
          exit 1
      - name: 統計更新時重新部署網站
        if: ${{ !cancelled() && steps.publish.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy_pages.yml --repo "$GITHUB_REPOSITORY" --ref master

  monthly-keepalive:
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '43 3 1 * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
      - name: 每月維持自動排程運作
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin master
            git checkout -B master origin/master
            git commit --allow-empty -m "chore: monthly Actions schedule keepalive"
            if git push origin master; then exit 0; fi
          done
          exit 1
