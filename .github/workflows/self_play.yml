name: Continuous self-play and recovery

# Five sequential waves per RUN; each wave = 15 CPU workers + one HF writer.
on:
  workflow_dispatch:
    inputs:
      continuous:
        description: "Backward-compatible flag; full five-wave run"
        type: boolean
        default: true
        required: false
  schedule:
    - cron: "23 * * * *"
    - cron: "43 3 1 * *"
  push:
    branches: [master]
    paths:
      - ".github/workflows/self_play.yml"
      - ".github/workflows/self_play_wave.yml"
      - ".github/workflows/train.yml"
      - ".github/scripts/publish_training_status.py"
      - "src/training/**"
      - "src/workers/**"
      - "test/**"

permissions:
  contents: write
  actions: write

concurrency:
  group: self-play-v2-${{ github.event_name == 'workflow_dispatch' && 'round' || 'watchdog' }}
  cancel-in-progress: false

jobs:
  validate-workflow-contract:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Validate YAML syntax, five-wave wiring and HF upload safety
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install PyYAML -r requirements.txt
          python - <<'PY'
          from pathlib import Path
          import yaml
          for name in ("self_play.yml", "self_play_wave.yml"):
              path = Path(".github/workflows") / name
              obj = yaml.safe_load(path.read_text())
              assert isinstance(obj, dict) and "jobs" in obj
              print("[Contract] Parsed", path)
          PY
          python -m unittest discover -s test -p "test_*.py" -v

  wave1:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/self_play_wave.yml
    with:
      wave: 1
    secrets: inherit

  wave2:
    needs: wave1
    # Do not discard four subsequent waves when a single CPU worker fails.
    # Each wave's sole HF writer independently verifies durable batches.
    if: ${{ always() && !cancelled() && github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/self_play_wave.yml
    with:
      wave: 2
    secrets: inherit

  wave3:
    needs: wave2
    # Do not discard four subsequent waves when a single CPU worker fails.
    # Each wave's sole HF writer independently verifies durable batches.
    if: ${{ always() && !cancelled() && github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/self_play_wave.yml
    with:
      wave: 3
    secrets: inherit

  wave4:
    needs: wave3
    # Do not discard four subsequent waves when a single CPU worker fails.
    # Each wave's sole HF writer independently verifies durable batches.
    if: ${{ always() && !cancelled() && github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/self_play_wave.yml
    with:
      wave: 4
    secrets: inherit

  wave5:
    needs: wave4
    # Do not discard four subsequent waves when a single CPU worker fails.
    # Each wave's sole HF writer independently verifies durable batches.
    if: ${{ always() && !cancelled() && github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/self_play_wave.yml
    with:
      wave: 5
    secrets: inherit

  continue-next-cycle:
    needs: wave5
    if: ${{ always() && !cancelled() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start next run then dispatch training if last train was over six hours ago
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run self_play.yml --repo "$GITHUB_REPOSITORY" --ref master
          echo "[Autonomy] Dispatched next five-wave run."
          LAST_TRAIN=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/train.yml/runs?per_page=1" --jq '.workflow_runs[0].created_at // ""')
          if [ -n "$LAST_TRAIN" ]; then
            AGE=$(( $(date -u +%s) - $(date -u -d "$LAST_TRAIN" +%s) ))
            if [ "$AGE" -ge 0 ] && [ "$AGE" -lt 21600 ]; then
              echo "[Autonomy] Training already dispatched ${AGE}s ago."
              exit 0
            fi
          fi
          gh workflow run train.yml --repo "$GITHUB_REPOSITORY" --ref master
          echo "[Autonomy] NNUE training dispatched."

  recovery-watchdog:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restart self-play only when no round is active
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Earlier runs may still use the retired four-worker layout.
          # Do not let them prevent the first 15-worker run from starting.
          ACTIVE_IDS=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/self_play.yml/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.event == "workflow_dispatch" and .status != "completed") | .id')
          for active_id in $ACTIVE_IDS; do
            # Legacy four-worker runs consume four parallel slots and upload
            # directly from each worker. Retire those runs now that the new
            # single-writer architecture has started, preserving uploaded data.
            LEGACY_JOBS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$active_id/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name | startswith("self-play-worker"))] | length')
            if [ "$LEGACY_JOBS" -gt 0 ]; then
              echo "[Watchdog] Cancelling retired four-worker run $active_id."
              gh run cancel "$active_id" --repo "$GITHUB_REPOSITORY" || true
              continue
            fi
            META=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$active_id" \
              --jq '[.created_at, .head_sha] | join(" ")')
            STARTED=${META%% *}
            AGE=$(( $(date -u +%s) - $(date -u -d "$STARTED" +%s) ))
            WAVE_JOBS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$active_id/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name | contains(" / Wave "))] | length')
            if [ "$WAVE_JOBS" -gt 0 ]; then
              echo "[Watchdog] Current 15-worker five-wave run $active_id is active."
              exit 0
            fi
            # Queued runs have no jobs yet. Allow GitHub's scheduler to begin.
            # Only re-dispatch an old run when it is definitely the retired layout.
            if [ "$AGE" -lt 1200 ]; then
              echo "[Watchdog] Recent dispatch $active_id is still starting."
              exit 0
            fi
            echo "[Watchdog] Run $active_id may still be initializing; no duplicate."
            exit 0
          done
          gh workflow run self_play.yml --repo "$GITHUB_REPOSITORY" --ref master
          echo "[Watchdog] Restarted fifteen-worker continuous self-play."

      - name: Checkout for monthly keepalive
        if: ${{ github.event_name == 'schedule' && github.event.schedule == '43 3 1 * *' }}
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Keep scheduled Actions active with an empty commit
        if: ${{ github.event_name == 'schedule' && github.event.schedule == '43 3 1 * *' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin master
            git checkout -B master origin/master
            git commit --allow-empty -m "chore: monthly Actions schedule keepalive"
            if git push origin master; then
              echo "[Keepalive] Updated repository activity without changing files."
              exit 0
            fi
          done
          echo "::error::Unable to push monthly keepalive after three attempts."
          exit 1
