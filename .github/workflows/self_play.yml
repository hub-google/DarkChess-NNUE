name: Continuous self-play and recovery

# Five sequential waves per RUN; each wave = 15 CPU workers + one HF writer.
on:
  workflow_dispatch:
    inputs:
      continuous:
        description: "Backward-compatible flag; full five-wave run"
        type: boolean
        default: true
        required: false
  schedule:
    - cron: "23 * * * *"
    - cron: "43 3 1 * *"
  push:
    branches: [master]
    paths:
      - ".github/workflows/self_play.yml"
      - ".github/workflows/self_play_wave.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: self-play-${{ github.event_name == 'workflow_dispatch' && 'round' || 'watchdog' }}
  cancel-in-progress: false

jobs:
  wave1:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/self_play_wave.yml
    with:
      wave: 1
    secrets: inherit

  wave2:
    needs: wave1
    uses: ./.github/workflows/self_play_wave.yml
    with:
      wave: 2
    secrets: inherit

  wave3:
    needs: wave2
    uses: ./.github/workflows/self_play_wave.yml
    with:
      wave: 3
    secrets: inherit

  wave4:
    needs: wave3
    uses: ./.github/workflows/self_play_wave.yml
    with:
      wave: 4
    secrets: inherit

  wave5:
    needs: wave4
    uses: ./.github/workflows/self_play_wave.yml
    with:
      wave: 5
    secrets: inherit

  continue-next-cycle:
    needs: wave5
    if: ${{ github.event_name == 'workflow_dispatch' && needs.wave5.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start next run then dispatch training if last train was over six hours ago
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run self_play.yml --repo "$GITHUB_REPOSITORY" --ref master
          echo "[Autonomy] Dispatched next five-wave run."
          LAST_TRAIN=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/train.yml/runs?per_page=1" --jq '.workflow_runs[0].created_at // ""')
          if [ -n "$LAST_TRAIN" ]; then
            AGE=$(( $(date -u +%s) - $(date -u -d "$LAST_TRAIN" +%s) ))
            if [ "$AGE" -ge 0 ] && [ "$AGE" -lt 21600 ]; then
              echo "[Autonomy] Training already dispatched ${AGE}s ago."
              exit 0
            fi
          fi
          gh workflow run train.yml --repo "$GITHUB_REPOSITORY" --ref master
          echo "[Autonomy] NNUE training dispatched."

  recovery-watchdog:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restart self-play only when no round is active
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Exclude scheduled and push-triggered watchdog runs from this count.
          ACTIVE=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/self_play.yml/runs?per_page=100" \
            --jq '[.workflow_runs[] | select(.event == "workflow_dispatch" and .status != "completed")] | length')
          if [ "$ACTIVE" -gt 0 ]; then
            echo "[Watchdog] ${ACTIVE} active self-play run(s); no duplicate."
            exit 0
          fi
          gh workflow run self_play.yml --repo "$GITHUB_REPOSITORY" --ref master
          echo "[Watchdog] Restarted fifteen-worker continuous self-play."

      - name: Checkout for monthly keepalive
        if: ${{ github.event_name == 'schedule' && github.event.schedule == '43 3 1 * *' }}
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Keep scheduled Actions active with an empty commit
        if: ${{ github.event_name == 'schedule' && github.event.schedule == '43 3 1 * *' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin master
            git checkout -B master origin/master
            git commit --allow-empty -m "chore: monthly Actions schedule keepalive"
            if git push origin master; then
              echo "[Keepalive] Updated repository activity without changing files."
              exit 0
            fi
          done
          echo "::error::Unable to push monthly keepalive after three attempts."
          exit 1
