name: Archive and clear Hugging Face staging

on:
  workflow_dispatch:

concurrency:
  group: hf-staging-writer
  cancel-in-progress: false

jobs:
  archive:
    name: Bulk archive immutable staging tree
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Hugging Face and Git-Xet clients
        run: |
          python -m pip install --upgrade "huggingface_hub>=0.32"
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/huggingface/xet-core/main/git_xet/install.sh | sh
          git-xet --version
          git lfs install

      - name: Authenticate Git without exposing the token in the clone URL
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global credential.helper store
          hf auth login --token "$HF_TOKEN" --add-to-git-credential

      - name: Sparse clone, merge, verify, and clear staging
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u src/workers/archive_hf_shard.py
