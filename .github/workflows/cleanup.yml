name: 🧹 清理 Hugging Face 散檔 (One-time Cleanup)

on:
  workflow_dispatch:

jobs:
  cleanup:
    name: 🧹 清理 staging 散檔
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
    - name: 📥 檢出程式碼
      uses: actions/checkout@v4
      
    - name: 🐍 設定 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: 📦 安裝相依套件
      run: |
        python -m pip install --upgrade pip
        pip install huggingface_hub
        
    - name: 🧹 清理 HF 上的散檔
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: python src/workers/cleanup_hf_staging.py
