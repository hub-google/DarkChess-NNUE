name: 暗棋 V2｜WASM 瀏覽器驗證
run-name: 暗棋 V2｜WASM 瀏覽器驗證｜${{ github.run_number }}
on:
  push:
    branches: [research-v2]
    paths: ['engine/board.hpp','engine/nnue.hpp','engine/search.hpp','engine/wasm_bridge.cpp','engine/build_wasm.sh','engine/browser_wasm_test.cjs','engine/search_corpus.cjs','frontend/src/**','.github/workflows/research_v2_wasm.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-v2-wasm-${{ github.ref }}
  cancel-in-progress: true
jobs:
  wasm:
    name: 同一 C++ 引擎與 Chromium 實戰
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        name: 取得研究程式
      - uses: actions/setup-node@v4
        name: 設定 Node
        with:
          node-version: 24
      - name: 安裝固定版本 Emscripten CPU 工具
        run: |
          git clone --depth 1 --branch 3.1.64 https://github.com/emscripten-core/emsdk.git /tmp/emsdk
          /tmp/emsdk/emsdk install 3.1.64
          /tmp/emsdk/emsdk activate 3.1.64
      - name: 生成凍結參考根分數與編譯 WASM
        run: |
          npm ci --prefix frontend
          ./frontend/node_modules/.bin/tsc -p src/workers/tsconfig.selfplay.json
          node engine/search_corpus.cjs
          source /tmp/emsdk/emsdk_env.sh
          bash engine/build_wasm.sh
          npm run build --prefix frontend
      - name: 安裝瀏覽器自動驗證工具
        run: |
          npm install --prefix /tmp/dc-browser --no-package-lock playwright@1.51.1
          /tmp/dc-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: 真實 Chromium 根分數、限時搜尋及遊戲測試
        env:
          PLAYWRIGHT_MODULE: /tmp/dc-browser/node_modules/playwright
        run: |
          set -euo pipefail
          mkdir -p /tmp/dc-site
          ln -s "$PWD/frontend/dist" /tmp/dc-site/DarkChess-NNUE
          python -m http.server 4173 --bind 127.0.0.1 --directory /tmp/dc-site >/tmp/dc-http.log 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/DarkChess-NNUE/ >/dev/null; then break; fi
            sleep 1
          done
          node engine/browser_wasm_test.cjs
          cat engine/wasm_report.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        name: 保存瀏覽器驗證與研究版網站
        with:
          name: v2-wasm-browser
          path: |
            engine/wasm_report.json
            frontend/dist/
          if-no-files-found: error
