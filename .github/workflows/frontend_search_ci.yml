name: Browser Star1 search and build CI

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "frontend/src/engine/search.ts"
      - "frontend/src/engine/__tests__/search.test.ts"
      - "frontend/src/App.tsx"
      - ".github/workflows/frontend_search_ci.yml"

jobs:
  test-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run test -- --run
      - working-directory: frontend
        run: npm run build
