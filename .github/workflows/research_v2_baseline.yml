name: 暗棋 V2｜基準與資料稽核
run-name: 暗棋 V2｜基準與資料稽核｜${{ github.run_number }}
on:
  push:
    branches: [research-v2]
    paths: ['research_v2/audit.py','research_v2/corpus.cjs','research_v2/movegen.cpp','.github/workflows/research_v2_baseline.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-v2-baseline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    name: 原型與舊引擎等價及效能
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        name: 取得研究分支
      - uses: actions/setup-node@v4
        name: 設定 Node
        with:
          node-version: 24
      - name: 安裝既有引擎依賴與編譯
        run: |
          npm ci --prefix frontend
          ./frontend/node_modules/.bin/tsc -p src/workers/tsconfig.selfplay.json
      - name: 產生固定公開局面及 TypeScript 基準
        run: node research_v2/corpus.cjs
      - name: 編譯 C++ 並驗證所有基本走法
        run: |
          g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra research_v2/movegen.cpp -o /tmp/movegen
          /tmp/movegen < research_v2/corpus.txt | tee research_v2/cpp.json
      - name: 核對校驗值與產出摘要
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          a=json.loads(Path('research_v2/typescript.json').read_text())
          b=json.loads(Path('research_v2/cpp.json').read_text())
          assert a['checksum']==b['checksum'] and b['parity']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write(f"## 基本走法微基準（非完整引擎）\n\n- 公開盤面：{a['positions']}\n- TS：{a['positions_per_second']:.0f} 局面/秒\n- C++：{b['positions_per_second']:.0f} 局面/秒\n- 校驗：一致\n- 未涵蓋長追歷史、搜尋及棋力。\n")
          PY
      - uses: actions/upload-artifact@v4
        name: 保存基準數據
        with:
          name: v2-baseline
          path: |
            research_v2/typescript.json
            research_v2/cpp.json
          if-no-files-found: error
  audit:
    name: 歷史棋譜唯讀稽核
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        name: 取得研究分支
      - uses: actions/setup-python@v5
        name: 設定 Python
        with:
          python-version: '3.11'
      - name: 安裝棋譜驗證套件
        run: pip install numpy numba huggingface_hub
      - name: 全量清點與分層抽樣重播
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u research_v2/audit.py
      - name: 產生稽核摘要
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('research_v2/audit.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## 棋譜唯讀稽核\n\n')
              for k,v in r['counts'].items(): f.write(f'- {k}: {v}\n')
              f.write(f"- 唯一識別碼：{r['unique_ids']}\n")
              f.write('- 抽樣合法性不等於訓練價值，未刪除資料。\n')
          PY
      - uses: actions/upload-artifact@v4
        name: 保存稽核結果
        with:
          name: v2-data-audit
          path: research_v2/audit.json
          if-no-files-found: error
