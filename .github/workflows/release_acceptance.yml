name: Final full-stack CPU acceptance and redeploy

# One release acceptance triggered by this workflow's addition. No cron.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/release_acceptance.yml'

permissions:
  contents: read
  actions: write

jobs:
  test-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Python correctness, public-state privacy, training and UCI checks
        run: python -m unittest discover -s test -p 'test_*.py' -v

  test-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Verify browser dark-chess search legality and NNUE features
        run: npm run test -- --run
        working-directory: frontend
      - name: Build deployed React/Vite bundle
        run: npm run build
        working-directory: frontend

  test-real-game:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Complete and replay one real CPU game
        env:
          BATCH_SIZE: '1'
          NUM_BATCHES: '1'
          OUTPUT_DIR: 'release_output'
          SELF_PLAY_SEED: '20261022'
          SEARCH_MAX_SECONDS: '2'
          SEARCH_NODE_BUDGET_EARLY: '500'
          SEARCH_NODE_BUDGET_MID: '1200'
          SEARCH_NODE_BUDGET_LATE: '2500'
          TORCH_NUM_THREADS: '1'
        run: |
          python -u src/workers/self_play.py
          python -u src/training/validate_replay.py --directory release_output --min-games 1
      - name: Verify same current HF dataset still accessible
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          token = os.environ.get('HF_TOKEN')
          if not token:
              raise RuntimeError('HF_TOKEN missing')
          info = HfApi(token=token).repo_info(
              'hub-google/DarkChess-NNUE-Data', repo_type='dataset'
          )
          print('[Release] HF dataset accessible at revision', info.sha)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-real-game-${{ github.sha }}
          path: release_output/*.jsonl.gz
          if-no-files-found: warn
          retention-days: 7

  redeploy-and-repeat:
    runs-on: ubuntu-latest
    needs: [test-python, test-browser, test-real-game]
    timeout-minutes: 10
    steps:
      - name: Re-deploy GitHub Pages and re-run end-to-end smoke once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy_pages.yml --repo "$GITHUB_REPOSITORY" --ref master
          gh workflow run self_play_trial.yml --repo "$GITHUB_REPOSITORY" --ref master
          gh workflow run pipeline_smoke.yml --repo "$GITHUB_REPOSITORY" --ref master
          echo "[Release] Requested clean Pages deployment, 2-game replay test and full policy/value pipeline smoke."
          echo "[Release] The historical production 15-runner matrix is not duplicated."
